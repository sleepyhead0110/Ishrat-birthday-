<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Ishrat 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  background: black;
}

/* Background Image */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('img.png') no-repeat center/cover;
  filter: brightness(0.5);
}

/* Center Content */
.content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
  width: 90%;
}

/* Heading */
h1 {
  font-size: 38px;
  color: #ff4d6d;
  text-shadow: 0 0 20px #ff4d6d;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #ff4d6d; }
  to { text-shadow: 0 0 30px #ff4d6d; }
}

/* Typing Text */
#typing {
  font-size: 18px;
  margin-top: 10px;
  text-shadow: 0 0 10px pink;
}

/* Button */
button {
  padding: 12px 20px;
  border: none;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  border-radius: 20px;
  margin-top: 15px;
}

/* Hearts */
.heart {
  position: absolute;
  color: pink;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-10vh);}
}

/* Canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="content">
  <h1>Happy Birthday Ishrat 💖</h1>
  <p id="typing"></p>
  <button onclick="start()">Tap for Surprise 🎁</button>
</div>

<audio id="music" loop>
  <source src="aud.mp3" type="audio/mpeg">
</audio>

<canvas id="fireworks"></canvas>

<script>

/* ▶️ START FUNCTION */
function start(){
  document.getElementById("music").play();
  typeEffect();
}

/* 💌 Typing Effect */
let text = [
  "You are my most special person 💕",
  "Ishrat... tum meri life ka best part ho ❤️",
  "Allah tumhe hamesha khush rakhe 🌙",
  "I really like you 🥰"
];

let line = 0;
let char = 0;

function typeEffect(){
  if(line < text.length){
    if(char < text[line].length){
      document.getElementById("typing").innerHTML += text[line].charAt(char);
      char++;
      setTimeout(typeEffect, 50);
    } else {
      document.getElementById("typing").innerHTML += "<br>";
      line++;
      char = 0;
      setTimeout(typeEffect, 700);
    }
  }
}

/* 💖 Hearts Animation */
setInterval(()=>{
  let heart = document.createElement("div");
  heart.innerHTML = "💖";
  heart.className = "heart";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (10 + Math.random()*20) + "px";
  document.body.appendChild(heart);

  setTimeout(()=> heart.remove(),5000);
},300);

/* 🎇 Fireworks */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework(){
  let x = Math.random()*canvas.width;
  let y = Math.random()*canvas.height/2;

  for(let i=0;i<50;i++){
    particles.push({
      x:x,
      y:y,
      dx:(Math.random()-0.5)*5,
      dy:(Math.random()-0.5)*5,
      life:100
    });
  }
}

function animate(){
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  particles.forEach((p,i)=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;

    ctx.fillStyle="hsl(" + Math.random()*360 + ",100%,50%)";
    ctx.fillRect(p.x,p.y,2,2);

    if(p.life<=0) particles.splice(i,1);
  });

  requestAnimationFrame(animate);
}

setInterval(createFirework,1000);
animate();

</script>

</body>
</html>
