<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Ishrat ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to top right, #ff758c, #ff7eb3);
    text-align: center;
    color: white;
    overflow: hidden;
}

.container {
    padding: 20px;
}

h1 {
    font-size: 34px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 25px pink; }
}

/* 🖼️ IMAGE BOX */
.image-box {
    position: relative;
    display: inline-block;
    margin-top: 20px;
}

.image-box img {
    width: 260px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* 💌 TEXT ON IMAGE */
#text {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    font-size: 16px;
    text-shadow: 0 0 10px black;
}

/* BUTTON */
button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #ff4b5c;
    cursor: pointer;
    margin-top: 20px;
}

/* 💖 hearts */
.heart {
    position: fixed;
    color: pink;
    animation: fall 5s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-100px); }
    100% { transform: translateY(100vh); }
}

/* 🎇 FIREWORK CANVAS */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">

<h1>Happy Birthday Ishrat 🎂💖</h1>

<div class="image-box">
    <img id="slide" src="img.png">
    <div id="text"></div>
</div>

<br>
<button onclick="start()">Tap Here 💞</button>

</div>

<audio id="music" loop>
    <source src="aud.mp3" type="audio/mpeg">
</audio>

<script>

/* 💞 Typing message */
let msg = [
"Hey Ishrat 💞",
"Happy Birthday 🎈",
"Tu bohot special hai ❤️",
"Allah tujhe hamesha khush rakhe 🍀",
"Mujhe tu bahut pasand hai 😘"
];

let i=0,j=0;
function type() {
    if(i < msg.length){
        if(j < msg[i].length){
            document.getElementById("text").innerHTML += msg[i][j];
            j++;
            setTimeout(type,50);
        } else {
            document.getElementById("text").innerHTML += "<br>";
            i++; j=0;
            setTimeout(type,500);
        }
    }
}

/* 🖼️ Slideshow */
let images = ["img.png","img2.png"];
let k=0;

function slideShow(){
    k=(k+1)%images.length;
    document.getElementById("slide").src = images[k];
    setTimeout(slideShow,2500);
}

/* 💖 Heart rain */
function hearts(){
    let h = document.createElement("div");
    h.innerHTML = "💖";
    h.className = "heart";
    h.style.left = Math.random()*100 + "%";
    document.body.appendChild(h);

    setTimeout(()=>{ h.remove(); },5000);
}

/* 🎇 Fireworks */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework(){
    let x = Math.random()*canvas.width;
    let y = Math.random()*canvas.height/2;

    for(let i=0;i<40;i++){
        particles.push({
            x:x,
            y:y,
            dx:(Math.random()-0.5)*4,
            dy:(Math.random()-0.5)*4,
            life:80
        });
    }
}

function animate(){
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,i)=>{
        p.x+=p.dx;
        p.y+=p.dy;
        p.life--;

        ctx.fillStyle="hsl(" + Math.random()*360 + ",100%,50%)";
        ctx.fillRect(p.x,p.y,2,2);

        if(p.life<=0) particles.splice(i,1);
    });

    requestAnimationFrame(animate);
}

setInterval(createFirework,1200);
animate();

/* ▶️ Start */
function start(){
    document.getElementById("music").play();
    type();
    slideShow();
    setInterval(hearts,300);
}

</script>

</body>
</html>
