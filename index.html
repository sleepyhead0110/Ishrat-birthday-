<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    text-align: center;
    color: white;
}

.container {
    padding: 20px;
}

h1 {
    font-size: 35px;
}

#text {
    font-size: 20px;
    margin-top: 20px;
}

img {
    width: 250px;
    border-radius: 15px;
    margin-top: 20px;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #ff4b5c;
    cursor: pointer;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Happy Birthday 🎂💖</h1>

<div id="text"></div>

<img id="slide" src="img.png">

<br>
<button onclick="start()">Tap Here 💞</button>

</div>

<!-- 🎵 MUSIC -->
<audio id="music" loop>
    <source src="aud.mp3" type="audio/mpeg">
</audio>

<script>

// 💞 Typing Text
let msg = [
"Hey you 💞",
"Happy Birthday 🎈",
"May God bless you 🍀",
"You are very special ❤️",
"Stay happy always 😘"
];

let i=0,j=0;

function type() {
    if(i < msg.length){
        if(j < msg[i].length){
            document.getElementById("text").innerHTML += msg[i][j];
            j++;
            setTimeout(type,50);
        } else {
            document.getElementById("text").innerHTML += "<br>";
            i++; j=0;
            setTimeout(type,500);
        }
    }
}

// 🖼️ Slideshow (TERI IMAGES)
let images = ["img.png","img2.png"];
let k=0;

function slideShow(){
    k=(k+1)%images.length;
    document.getElementById("slide").src = images[k];
    setTimeout(slideShow,2000);
}

// 🎉 Simple Confetti
function confetti(){
    let div = document.createElement("div");
    div.style.position="fixed";
    div.style.width="6px";
    div.style.height="6px";
    div.style.background="white";
    div.style.left=Math.random()*100+"%";
    div.style.top="-10px";
    document.body.appendChild(div);

    let fall = setInterval(()=>{
        div.style.top = (parseInt(div.style.top)+5)+"px";
        if(parseInt(div.style.top)>window.innerHeight){
            clearInterval(fall);
            div.remove();
        }
    },50);
}

// ▶️ Start
function start(){
    document.getElementById("music").play();
    type();
    slideShow();
    setInterval(confetti,200);
}

</script>

</body>
</html>
