<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Ishrat ❤️</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="file/default.css">

<script src="file/jquery.min.js"></script>
<script src="file/jscex.min.js"></script>
<script src="file/jscex-parser.js"></script>
<script src="file/jscex-jit.js"></script>
<script src="file/jscex-builderbase.min.js"></script>
<script src="file/jscex-async.min.js"></script>
<script src="file/jscex-async-powerpack.min.js"></script>
<script src="file/function.js"></script>
<script src="file/love.js"></script>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to top right, #ff758c, #ff7eb3);
    color: white;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    overflow-x: hidden;
}

#main {
    padding: 10px;
}

#code {
    font-size: 18px;
    line-height: 1.6;
}

.say {
    display: block;
}

#clock {
    font-size: 16px;
    margin-top: 10px;
}

canvas {
    width: 100% !important;
    height: auto !important;
    max-width: 100%;
}

@media (max-width: 600px) {
    #code {
        font-size: 16px;
    }
}
</style>

<script>
function playAudio() {
    var audio = document.getElementById("myAudio");
    audio.play();
}
</script>

</head>

<body>

<div id="main">

<audio autoplay id="myAudio">
    <source src="aud.mp3" type="audio/mp3">
</audio>

<div id="text">
<div id="code">

<span class="say">Hey Ishrat 💞</span>
<span class="say">Happy Birthday 🎂🎈</span>
<span class="say">May Allah bless you always 🤲</span>
<span class="say">Aur tumhari life hamesha khushiyon se bhari rahe 💕</span>
<span class="say">Sach me... tum bohot special ho ❤️</span>
<span class="say">Tumhari smile sabse pyari hai 😊</span>
<span class="say">Aaj ka din tumhare liye perfect ho 🎉</span>

</div>
</div>

<div id="clock-box">
<span id="clock"></span>
</div>

<canvas id="canvas"></canvas>

</div>

<script>
(function() {

var canvas = $('#canvas');

if (!canvas[0].getContext) {
    return false;
}

var width = $(window).width();
var height = $(window).height() * 0.7;

canvas.attr("width", width);
canvas.attr("height", height);

var opts = {
    seed: {
        x: width / 2,
        color: "rgb(255, 0, 100)",
        scale: 2
    },
    branch: [],
    bloom: {
        num: 500,
        width: width,
        height: height,
    },
    footer: {
        width: width,
        height: 5,
        speed: 10,
    }
};

var tree = new Tree(canvas[0], width, height, opts);
var seed = tree.seed;
var foot = tree.footer;
var hold = 1;

canvas.click(function(e) {
    playAudio();
    hold = 0;
});

var seedAnimate = eval(Jscex.compile("async", function () {
    seed.draw();
    while (hold) {
        $await(Jscex.Async.sleep(10));
    }
    while (seed.canScale()) {
        seed.scale(0.95);
        $await(Jscex.Async.sleep(10));
    }
}));

var growAnimate = eval(Jscex.compile("async", function () {
    do {
        tree.grow();
        $await(Jscex.Async.sleep(10));
    } while (tree.canGrow());
}));

var flowAnimate = eval(Jscex.compile("async", function () {
    do {
        tree.flower(2);
        $await(Jscex.Async.sleep(10));
    } while (tree.canFlower());
}));

var runAsync = eval(Jscex.compile("async", function () {
    $await(seedAnimate());
    $await(growAnimate());
    $await(flowAnimate());
}));

runAsync().start();

})();
</script>

</body>
</html>
