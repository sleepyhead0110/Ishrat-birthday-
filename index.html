<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    background: black;
    color: white;
    text-align: center;
}

#main {
    position: relative;
    z-index: 2;
    padding: 20px;
}

h1 {
    font-size: 40px;
}

#text {
    font-size: 20px;
    margin-top: 20px;
}

img {
    width: 250px;
    border-radius: 15px;
    margin-top: 20px;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: pink;
    cursor: pointer;
}

/* fireworks canvas */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div id="main">
    <h1>Happy Birthday 🎂💖</h1>
    <div id="text"></div>

    <img id="slide" src="image1.jpg">

    <br>
    <button onclick="startAll()">Tap Here 💞</button>
</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// 💞 Typing effect
let msg = [
"Hey you 💞",
"Happy Birthday 🎈",
"May God bless you 🍀",
"You are special ❤️",
"Stay happy always 😘"
];

let i=0,j=0;
function type() {
    if(i < msg.length){
        if(j < msg[i].length){
            document.getElementById("text").innerHTML += msg[i][j];
            j++;
            setTimeout(type,50);
        } else {
            document.getElementById("text").innerHTML += "<br>";
            i++; j=0;
            setTimeout(type,500);
        }
    }
}

// 🖼️ Slideshow
let images = ["image1.jpg","image2.jpg","image3.jpg"];
let k=0;
function slideShow(){
    k=(k+1)%images.length;
    document.getElementById("slide").src = images[k];
    setTimeout(slideShow,2000);
}

// 🎆 Fireworks
let canvas = document.getElementById("fireworks");
let ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function firework(){
    for(let i=0;i<50;i++){
        let x = Math.random()*canvas.width;
        let y = Math.random()*canvas.height;
        ctx.fillStyle = "hsl(" + Math.random()*360 + ",100%,50%)";
        ctx.fillRect(x,y,3,3);
    }
    setTimeout(firework,100);
}

// 🎉 Confetti
function confetti(){
    for(let i=0;i<100;i++){
        let div = document.createElement("div");
        div.style.position="fixed";
        div.style.width="5px";
        div.style.height="5px";
        div.style.background="hsl("+Math.random()*360+",100%,50%)";
        div.style.left=Math.random()*100+"%";
        div.style.top="-10px";
        div.style.zIndex="3";
        document.body.appendChild(div);

        let fall = setInterval(()=>{
            div.style.top = (parseInt(div.style.top)+5)+"px";
            if(parseInt(div.style.top)>window.innerHeight){
                clearInterval(fall);
                div.remove();
            }
        },50);
    }
}

// ▶️ Start All
function startAll(){
    document.getElementById("music").play();
    type();
    slideShow();
    firework();
    setInterval(confetti,2000);
}
</script>

</body>
</html>
