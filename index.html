<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Ishrat ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to top right, #ff758c, #ff7eb3);
    text-align: center;
    color: white;
    overflow-x: hidden;
}

.container {
    padding: 20px;
}

h1 {
    font-size: 38px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 25px pink; }
}

#text {
    font-size: 20px;
    margin-top: 20px;
}

img {
    width: 260px;
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.cake {
    width: 200px;
    margin-top: 20px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #ff4b5c;
    cursor: pointer;
    margin-top: 20px;
}

/* 💖 hearts */
.heart {
    position: fixed;
    color: pink;
    animation: fall 5s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-100px); }
    100% { transform: translateY(100vh); }
}
</style>
</head>

<body>

<div class="container">

<h1>Happy Birthday Ishrat 🎂💖</h1>

<div id="text"></div>

<!-- 🎂 CAKE -->
<img src="cake.png" class="cake">

<!-- 🖼️ IMAGES -->
<img id="slide" src="img.png">

<br>
<button onclick="start()">Tap Here 💞</button>

</div>

<!-- 🎵 MUSIC -->
<audio id="music" loop>
    <source src="aud.mp3" type="audio/mpeg">
</audio>

<script>

// 💞 Typing message (ISHRAT SPECIAL)
let msg = [
"Hey Ishrat 💞",
"Happy Birthday 🎈",
"Tu bohot special hai ❤️",
"Allah tujhe hamesha khush rakhe 🍀",
"Mujhe tu bahut pasand hai 😘"
];

let i=0,j=0;
function type() {
    if(i < msg.length){
        if(j < msg[i].length){
            document.getElementById("text").innerHTML += msg[i][j];
            j++;
            setTimeout(type,50);
        } else {
            document.getElementById("text").innerHTML += "<br>";
            i++; j=0;
            setTimeout(type,500);
        }
    }
}

// 🖼️ Slideshow
let images = ["img.png","img2.png"];
let k=0;

function slideShow(){
    k=(k+1)%images.length;
    document.getElementById("slide").src = images[k];
    setTimeout(slideShow,2000);
}

// 💖 Heart rain
function hearts(){
    let h = document.createElement("div");
    h.innerHTML = "💖";
    h.className = "heart";
    h.style.left = Math.random()*100 + "%";
    document.body.appendChild(h);

    setTimeout(()=>{ h.remove(); },5000);
}

// ▶️ Start
function start(){
    document.getElementById("music").play();
    type();
    slideShow();
    setInterval(hearts,300);
}

</script>

</body>
</html>
